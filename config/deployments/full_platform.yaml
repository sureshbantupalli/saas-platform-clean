# Full Platform Deployment Scenario
# Target: Complete multi-tenant yoga studio platform with all features
# Deployment Time: 120-180 minutes
# Risk Level: MEDIUM (many interactions to validate)

scenario_name: full_platform
display_name: "Full Platform (Setu Yoga Studio)"
description: |
  Complete multi-tenant yoga studio platform with all features enabled.
  Includes: Fitness scheduling, bookings, payments, CRM, assessments,
  reporting, and full communications infrastructure.

modules:
  - core_infrastructure
  - user_management
  - fitness_studio
  - financial
  - communication
  - analytics_reporting
  - learning_assessment

feature_flags:
  fitness_studio_enabled: true
  bookings_enabled: true
  sessions_enabled: true
  payments_enabled: true
  assessments_enabled: true
  analytics_enabled: true
  financial_enabled: true
  reporting_enabled: true
  communications_enabled: true
  whatsapp_enabled: true
  attendance_tracking: true
  membership_renewal: true
  certificate_generation: true

estimated_resources:
  database_tables: 100+
  api_endpoints: 50+
  deployment_time_minutes: 150
  required_disk_space_gb: 20
  estimated_monthly_cost: "$1000-2000"

test_requirements:
  critical_tests: 75
  core_tests: 150
  module_tests: 570
  integration_tests: 150
  scenario_tests: 100
  total_test_count: 1000+
  estimated_test_time_minutes: 35
  minimum_coverage_percent: 85

deployment_checklist:
  phase_1_dependencies:
    - validate_dependencies()
    - validate_no_circular_dependencies()
    - validate_installation_order()
  phase_2_configuration:
    - set_payment_gateway()
    - set_whatsapp_credentials()
    - set_smtp_config()
    - set_analytics_backend()
    - enable_all_feature_flags()
  phase_3_database:
    - backup_database()
    - run_migrations()
    - verify_schema()
    - create_indexes()
  phase_4_testing:
    - run_critical_tests()
    - run_core_tests()
    - run_module_tests()
    - run_integration_tests()
    - run_scenario_tests()
    - verify_coverage_85_percent()
  phase_5_security:
    - security_audit()
    - check_https_enabled()
    - check_secrets_configured()
    - run_dependency_check()
  phase_6_deployment:
    - backup_current_system()
    - deploy_code()
    - run_migrations()
    - collect_static_files()
    - flush_cache()
    - restart_services()
  phase_7_verification:
    - health_check_all_endpoints()
    - smoke_tests()
    - verify_multi_tenancy()
    - verify_payments_working()
    - verify_communications_working()
  phase_8_monitoring:
    - enable_monitoring()
    - setup_alerts()
    - enable_logging()

deployment_order:
  step_1: "Validate dependencies & configuration"
  step_2: "Create database backup"
  step_3: "Run Django migrations"
  step_4: "Run full test suite (1000+ tests)"
  step_5: "Collect static files"
  step_6: "Deploy code to servers"
  step_7: "Run post-deployment health checks"
  step_8: "Verify all features operational"
  step_9: "Enable monitoring & alerts"
  step_10: "Notify team & customers"

safety_gates:
  - dependency_validation
  - test_coverage_check (min: 85%)
  - security_audit
  - database_compatibility_check
  - configuration_validation
  - payment_gateway_test
  - whatsapp_integration_test

post_deployment_checks:
  - all_endpoints_responsive
  - database_connectivity_ok
  - multi_tenant_isolation_verified
  - payments_processing_ok
  - communications_operational
  - assessments_working
  - reports_generating
  - logging_operational
  - monitoring_active

known_issues: []

performance_targets:
  - page_load_time: <2 seconds
  - api_response_time: <500ms
  - database_query_time: <200ms
  - payment_processing: <5 seconds
  - assessment_scoring: <1 second

rollback_procedure:
  step_1: "Alert team to deployment rollback"
  step_2: "Restore from backup"
  step_3: "Clear application cache"
  step_4: "Restart all services"
  step_5: "Run health checks"
  step_6: "Verify data integrity"
  step_7: "Post-rollback notification"

supported_tenants:
  - setu_yoga_studio (main platform owner)
  - "* (all studio types)"

monitoring_config:
  uptime_sla: "99.9%"
  alert_thresholds:
    error_rate: "> 1%"
    latency_p99: "> 5 seconds"
    cpu_usage: "> 80%"
    memory_usage: "> 85%"
    disk_usage: "> 90%"

support_contact: "devops@setuschool.com"
estimated_cost_per_month: "$1500"
max_tenants_supported: "100+"
max_concurrent_users: "10000+"
