[pytest]
DJANGO_SETTINGS_MODULE = config.settings.base
# `tests_*.py` is included because a number of real test modules use that
# name (apps/audit, apps/payments, apps/reporting, apps/communications).
# Without it pytest collected nothing from those files — the tests existed
# but never ran.
#
# `*_test.py` is deliberately NOT included: apps/core/views_test.py is a
# views module whose view function is called test_ui, which pytest would
# mis-collect as a test and fail.
python_files = tests.py test_*.py *_tests.py tests_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -v

testpaths = apps/assessments/tests

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    multi_tenancy: marks tests that verify tenant isolation
    critical: marks tests that must pass before deployment
