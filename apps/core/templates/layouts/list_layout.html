{% extends "layouts/base.html" %}

{% block content %}

<h1>{{ title }}</h1>

<table border="1" cellpadding="8" cellspacing="0" width="100%">

    <thead>
        <tr>

            {% for column in columns %}
                <th>{{ column }}</th>
            {% endfor %}

        </tr>
    </thead>

    <tbody>

        {% for row in rows %}
        <tr>

            {% for cell in row %}
                <td>{{ cell|safe }}</td>
            {% endfor %}

        </tr>
        {% endfor %}

    </tbody>

<a href="/sessions/create/">
    <button>Create New</button>
</a>

</table>

{% endblock %}
