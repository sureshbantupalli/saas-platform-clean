{% extends "layouts/base.html" %}

{% block content %}

<h1>{{ title }}</h1>

<form method="post">

    {% csrf_token %}

    <table>

        {% for field in form %}

        <tr>

            <td>
                <label>{{ field.label }}</label>
            </td>

            <td>
                {{ field }}
            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <button type="submit">
        Save
    </button>

</form>

{% endblock %}
