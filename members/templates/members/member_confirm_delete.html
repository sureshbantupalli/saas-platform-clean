{% extends "base.html" %}
{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0 p-4 mt-4">

        <h4 class="fw-bold text-danger mb-3">
            Confirm Delete
        </h4>

        <p>
            Are you sure you want to delete
            <strong>{{ member.first_name }} {{ member.last_name }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex flex-row flex-nowrap align-items-center gap-3 pt-3 mt-2" style="border-top:1px solid #e2e8f0;">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'members:member_detail' member.id %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>

    </div>

</div>

{% endblock %}
