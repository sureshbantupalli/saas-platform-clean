{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            {% if form.instance.pk %}
                Edit Member
            {% else %}
                Add Member
            {% endif %}
        </h2>

        <a href="{% url 'members:member_list' %}" class="btn btn-outline-secondary">
            Back to List
        </a>
    </div>

    <!-- Form Card -->
    <div class="card shadow-sm border-0 p-4">

        <form method="post">
            {% csrf_token %}

            <div class="row g-3">

                <!-- First Name -->
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    {{ form.first_name }}
                </div>

                <!-- Last Name -->
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    {{ form.last_name }}
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    {{ form.email }}
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    {{ form.phone }}
                </div>

                <!-- Branches -->
                <div class="col-md-6">
                    <label class="form-label">Branches</label>
                    {{ form.branches }}
                </div>

            </div>

            <!-- Actions -->
            <div class="d-flex flex-row flex-nowrap justify-content-between align-items-center gap-3 pt-3 mt-2" style="border-top:1px solid #e2e8f0;">
                <a href="{% url 'members:member_list' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Member</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
