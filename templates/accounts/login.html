{% extends "auth_base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}

<div class="card p-4 p-sm-5" style="border-radius: var(--r-xl); box-shadow: var(--shadow-lg);">

    <div class="text-center mb-4">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#2563eb);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;margin:0 auto 14px;" aria-hidden="true">S</div>
        <h1 class="h4 fw-bold mb-1" style="letter-spacing:-0.02em;">Welcome back</h1>
        <p class="text-muted small mb-0">Sign in to your account</p>
    </div>

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger mb-3" role="alert">
            <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>{{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="POST" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label" for="id_email">Email address</label>
            <input type="email"
                   name="email"
                   id="id_email"
                   class="form-control"
                   autocomplete="email"
                   required
                   aria-required="true">
        </div>

        <div class="mb-4">
            <label class="form-label" for="id_password">Password</label>
            <input type="password"
                   name="password"
                   id="id_password"
                   class="form-control"
                   autocomplete="current-password"
                   required
                   aria-required="true">
        </div>

        <button type="submit" class="btn btn-primary w-100" style="padding:10px;">
            <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>
            Sign in
        </button>
    </form>
</div>

{% endblock %}
