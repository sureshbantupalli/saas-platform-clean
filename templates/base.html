<!DOCTYPE html>
<html>
<head>
    <title>SaaS Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
            font-size: 14px;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            height: 100vh;
            background-color: #111827;
            color: white;
            position: fixed;
            width: 240px;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: 600;
            font-size: 18px;
            border-bottom: 1px solid #1f2937;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
            font-size: 14px;
            transition: all 0.2s ease-in-out;
        }

        .sidebar a:hover {
            background-color: #1f2937;
            color: white;
        }

        .sidebar .active {
            background-color: #2563eb;
            color: white;
            font-weight: 500;
        }

        /* ===== Topbar ===== */
        .topbar {
            background-color: white;
            padding: 15px 25px;
            border-bottom: 1px solid #e5e7eb;
            margin-left: 240px;
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-left: 240px;
            padding: 30px;
            background-color: #f3f4f6;
            min-height: 100vh;
        }

        .username {
            font-weight: 500;
            color: #374151;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

    <div class="sidebar-header">
        SaaS Platform
    </div>

    <a href="/monitoring/lifecycle-health/"
       class="{% if request.path == '/monitoring/lifecycle-health/' %}active{% endif %}">
        Lifecycle Monitoring
    </a>

    <a href="/members/"
       class="{% if request.path|slice:':9' == '/members/' %}active{% endif %}">
        Members
    </a>

    <a href="#">
        CRM
    </a>

    <a href="#">
        Reports
    </a>

</div>

<!-- Topbar -->
<div class="topbar d-flex justify-content-between align-items-center">
    <div>
        <strong>Internal Admin Panel</strong>
    </div>
    <div class="username">
        {% if request.user.is_authenticated %}
            {{ request.user.username }}
        {% else %}
            Guest
        {% endif %}
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
