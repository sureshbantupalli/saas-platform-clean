{% extends "base.html" %}
{% load static %}

{% block content %}

<form method="post" style="display:none;">{% csrf_token %}</form>

<h2 class="mb-3">Attendance</h2>

<!-- Mode Switch -->
<div class="btn-group mb-4" role="group" aria-label="Attendance mode">
    <input type="radio" class="btn-check" name="mode" id="modeWalkin" value="walkin" checked>
    <label class="btn btn-outline-primary" for="modeWalkin">Walk-in</label>

    <input type="radio" class="btn-check" name="mode" id="modeSession" value="session">
    <label class="btn btn-outline-primary" for="modeSession">Session</label>
</div>

<!-- WALK-IN SECTION -->
<div id="walkin-section">
    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label fw-semibold">Search Member</label>
            <input type="text" id="search" class="form-control" placeholder="Type name or phone…">
            <div id="results" class="mt-2"></div>
        </div>
    </div>

    <div id="member-card" class="card" style="display:none;">
        <div class="card-body">
            <h5 id="name" class="card-title mb-1"></h5>
            <p id="phone" class="text-muted small mb-2"></p>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <small class="text-muted d-block">Plan</small>
                    <strong id="plan">—</strong>
                </div>
                <div class="col-6">
                    <small class="text-muted d-block">Remaining Sessions</small>
                    <strong id="sessions">—</strong>
                </div>
            </div>
            <p id="warning" class="text-danger small" style="display:none;">No sessions remaining</p>
            <button id="markBtn" class="btn btn-success w-100" onclick="markAttendance()">Mark Present</button>
            <div id="successMsg" class="alert alert-success mt-3" style="display:none;">
                Attendance marked successfully
            </div>
        </div>
    </div>
</div>

<!-- SESSION SECTION -->
<div id="session-section" style="display:none;">
    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label fw-semibold">Select Session</label>
            <select id="sessionSelect" class="form-select">
                <option value="">— Select Session —</option>
            </select>
        </div>
    </div>
    <div id="session-members"></div>
</div>

<script>
let selectedMemberId = null;

function getCSRFToken() {
    const name = "csrftoken";
    for (let cookie of document.cookie.split(";")) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) return cookie.substring(name.length + 1);
    }
    return null;
}

document.querySelectorAll('input[name="mode"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        const mode = this.value;
        document.getElementById("walkin-section").style.display = mode === "walkin" ? "block" : "none";
        document.getElementById("session-section").style.display = mode === "session" ? "block" : "none";
        if (mode === "session") loadSessions();
    });
});

document.getElementById("search").addEventListener("input", function() {
    const query = this.value;
    fetch(`/attendance/api/search-members/?q=${query}`, { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            let html = "";
            data.forEach(m => {
                html += `<div class="list-group-item list-group-item-action" style="cursor:pointer;"
                              onclick='selectMember(${JSON.stringify(m)})'>
                              <strong>${m.name}</strong> <span class="text-muted small">${m.phone || ''}</span>
                         </div>`;
            });
            document.getElementById("results").innerHTML = html ? `<div class="list-group">${html}</div>` : "";
        });
});

function selectMember(member) {
    selectedMemberId = member.id;
    document.getElementById("member-card").style.display = "block";
    document.getElementById("name").innerText = member.name;
    document.getElementById("phone").innerText = member.phone || "";
    document.getElementById("plan").innerText = member.plan || "—";
    document.getElementById("sessions").innerText = member.remaining_sessions;

    const btn = document.getElementById("markBtn");
    const warning = document.getElementById("warning");
    const noSessions = member.remaining_sessions <= 0;
    btn.disabled = noSessions;
    warning.style.display = noSessions ? "block" : "none";
    document.getElementById("results").innerHTML = "";
    document.getElementById("successMsg").style.display = "none";
}

async function markAttendance() {
    if (!selectedMemberId) return;
    const res = await fetch('/attendance/api/mark-attendance/', {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
        body: JSON.stringify({ member_id: selectedMemberId, attendance_type: "walkin" })
    });
    const data = await res.json();
    if (data.message) {
        const msg = document.getElementById("successMsg");
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 2000);

        const sessEl = document.getElementById("sessions");
        let current = parseInt(sessEl.innerText) || 0;
        let updated = Math.max(current - 1, 0);
        sessEl.innerText = updated;
        if (updated <= 0) {
            document.getElementById("markBtn").disabled = true;
            document.getElementById("warning").style.display = "block";
        }
    } else {
        alert("Error: " + JSON.stringify(data));
    }
}

function loadSessions() {
    fetch("/attendance/api/bookings/")
        .then(res => res.json())
        .then(data => {
            let html = '<option value="">— Select Session —</option>';
            data.forEach(session => {
                html += `<option value="${session.id}">${session.name || 'Session'}</option>`;
            });
            document.getElementById("sessionSelect").innerHTML = html;
        });
}

document.getElementById("sessionSelect").addEventListener("change", function() {
    const bookingId = this.value;
    if (!bookingId) return;
    fetch(`/attendance/api/sessions/${bookingId}/members/`)
        .then(res => res.json())
        .then(data => {
            let html = '<h6 class="mb-2">Members</h6>';
            data.members.forEach(m => {
                html += `<div class="card mb-2">
                    <div class="card-body d-flex justify-content-between align-items-center py-2">
                        <strong>${m.name}</strong>
                        <button class="btn btn-sm btn-success"
                                onclick="markSessionAttendance('${bookingId}', '${m.id}')">
                            Mark Present
                        </button>
                    </div>
                </div>`;
            });
            document.getElementById("session-members").innerHTML = html;
        });
});

function markSessionAttendance(bookingId, memberId) {
    fetch("/attendance/api/mark-attendance/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
        credentials: "include",
        body: JSON.stringify({ member_id: memberId, booking_id: bookingId, attendance_type: "session" })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message) {
            alert("Attendance marked!");
        } else {
            alert(data.error || "Error marking attendance");
        }
    });
}
</script>

{% endblock %}
